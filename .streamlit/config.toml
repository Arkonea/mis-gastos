# Tema oscuro minimalista para "Mis Gastos"
[theme]
base = "dark"
primaryColor = "#22c55e"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans serif"

# Colores específicos de la barra lateral
[theme.sidebar]
backgroundColor = "#0b0f14"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
primaryColor = "#22c55e"

# NOTA: no fijar 'headless' aquí. En Streamlit Cloud debe quedar en su valor
# por defecto (true); si se fuerza false, la app se queda esperando el correo
# de bienvenida y el servidor nunca arranca.
[server]
runOnSave = true

[browser]
gatherUsageStats = false
